name: VVV Watch

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vvvwatch-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    outputs:
      degraded: ${{ steps.refresh.outputs.degraded }}
      pages_mode: ${{ steps.pages.outputs.mode }}
      evidence_sha: ${{ steps.evidence.outputs.sha }}
      index_sha: ${{ steps.release.outputs.index_sha }}
      snapshot_sha: ${{ steps.release.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test
      - name: Refresh completed UTC days
        id: refresh
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: |
          result=0
          npm run snapshot || result=$?
          if [ "$result" = 2 ]; then
            echo "degraded=true" >> "$GITHUB_OUTPUT"
          elif [ "$result" != 0 ]; then
            exit "$result"
          fi
      - run: npm run build
      - name: Commit verified evidence and alert state
        id: evidence
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Update evidence through $(node -p "require('./data/latest.json').lastDay")"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record the built page and snapshot
        id: release
        run: |
          echo "index_sha=$(sha256sum dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "snapshot_sha=$(sha256sum dist/data/latest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Package Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - name: Read Pages publishing mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Check out the published branch
        if: steps.pages.outputs.mode == 'legacy'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages
          path: published
      - name: Publish the static branch
        if: steps.pages.outputs.mode == 'legacy'
        run: |
          rsync -a --delete --exclude=.git dist/ published/
          git -C published add -A
          if ! git -C published diff --cached --quiet; then
            git -C published config user.name 'github-actions[bot]'
            git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C published commit -m "Publish VVV Watch for $(date -u +%F)"
            git -C published push origin HEAD:gh-pages
          fi
  alerts:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.evidence_sha != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.evidence_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Deliver durable issue alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/issues.mjs
  publish:
    needs: build
    if: needs.build.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify-publication:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.pages_mode == 'legacy' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify the public page and snapshot
        env:
          PAGES_MODE: ${{ needs.build.outputs.pages_mode }}
          EXPECTED_INDEX_SHA: ${{ needs.build.outputs.index_sha }}
          EXPECTED_SNAPSHOT_SHA: ${{ needs.build.outputs.snapshot_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-publication.mjs
  freshness:
    if: needs.build.outputs.degraded == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A collector failed. The site retains and dates its last verified readings."
          exit 1
