<!doctype html>
<html lang="en" class="not-found-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1efe8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1517">
  <script>
    try {
      const saved = localStorage.getItem('ap-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
        for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
          if (meta.media === `(prefers-color-scheme: ${saved})`) meta.removeAttribute('media');
          else meta.remove();
        }
      }
    } catch { /* System colors still apply when storage is unavailable. */ }
  </script>
  <title>Page not found · VVV watch</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="masthead wrap">
  <a class="identity" href="/" aria-label="VVV watch home"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><path class="mark-level" d="M30.8 45.3H69.2L50 88Z"/><path class="mark-v" d="M15 12 50 86 85 12"/></svg><span><span class="title-token">VVV</span> <em>watch</em></span></a>
</header>
<main class="wrap not-found">
  <p class="eyeline">404</p>
  <h1>Page <em>not found.</em></h1>
  <a href="/">Open the VVV watch dashboard →</a>
</main>
</body>
</html>
